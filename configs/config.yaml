# ==========================================================
# Dataset Configuration
# ==========================================================

dataset:
  # Root directory of the dataset
  path: data/raw

  # Annotation file
  annotation_file: train.txt

  # Directory containing images
  image_directory: train

  # Number of classes
  num_classes: 5

# ==========================================================
# Preprocessing Configuration
# ==========================================================

preprocessing:
  pipeline:
    - resize
    - normalize
    - to_tensor

  resize:
    height: 224
    width: 224

  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# ==========================================================
# Model Configuration
# ==========================================================

model:
  architecture: efficientnet_b0
  pretrained: true
  num_classes: 5

# ==========================================================
# Loss Configuration
# ==========================================================

loss:
  name: cross_entropy

  # Label smoothing improves generalization.
  label_smoothing: 0.1

# ==========================================================
# Optimizer Configuration
# ==========================================================

optimizer:
  name: adamw

  learning_rate: 0.0003

  weight_decay: 0.0001

# ==========================================================
# Scheduler Configuration
# ==========================================================

scheduler:
  name: cosine

  eta_min: 1.0e-6

# ==========================================================
# Training Configuration
# ==========================================================

training:
  epochs: 100

  # auto | cpu | cuda
  device: cuda

  # Reproducibility
  deterministic: true
  cudnn_benchmark: false

  # Gradient accumulation
  gradient_accumulation_steps: 1

  # Validation every N epochs
  validation_frequency: 1

# ==========================================================
# Mixed Precision Configuration
# ==========================================================

mixed_precision:
  enabled: true

  # float16 | bfloat16
  dtype: float16

# ==========================================================
# DataLoader Configuration
# ==========================================================

dataloader:
  batch_size: 48

  num_workers: 4

  shuffle: true

  pin_memory: true

  persistent_workers: true

  drop_last: false

# ==========================================================
# Checkpoint Configuration
# ==========================================================

checkpoint:
  directory: checkpoints

  save_best: true

  save_latest: true

  save_every_epoch: true

  monitor: qwk

# ==========================================================
# Early Stopping Configuration
# ==========================================================

early_stopping:
  enabled: true

  patience: 20

  monitor: qwk

  min_delta: 0.001

# ==========================================================
# Logging Configuration
# ==========================================================

logging:
  log_every_n_steps: 20

# ==========================================================
# Metrics Configuration
# ==========================================================

metrics:
  primary:
    - accuracy
    - qwk
  secondary:
    - macro_f1
  per_class: true

# ==========================================================
# Experiment Configuration
# ==========================================================

experiment:
  name: baseline_efficientnet_b0

  seed: 42

  output_directory: experiments
