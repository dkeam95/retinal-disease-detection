# ==========================================================
# Detection Experiment Configuration: Faster R-CNN (ResNet50-FPN)
# ==========================================================

dataset:
  path: data/raw
  annotation_file: train.txt
  image_directory: train
  num_classes: 5

detection_dataset:
  xml_dir: data/raw/lesion_detection/train
  image_dir: data/raw/train
  num_classes: 5

detection_model:
  architecture: fasterrcnn_resnet50_fpn
  pretrained: true
  num_classes: 5
  score_thresh: 0.25
  nms_thresh: 0.45
  min_size: 640
  max_size: 640

preprocessing:
  pipeline: [resize, normalize, to_tensor]
  resize:
    height: 640
    width: 640
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  architecture: fasterrcnn_resnet50_fpn
  pretrained: true
  num_classes: 5

loss:
  name: cross_entropy

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0005

scheduler:
  name: cosine
  eta_min: 1.0e-6

training:
  epochs: 20
  device: cuda
  deterministic: true

mixed_precision:
  enabled: true
  dtype: float16

dataloader:
  batch_size: 4
  num_workers: 2
  shuffle: true
  pin_memory: true
  persistent_workers: false
  drop_last: false

checkpoint:
  directory: experiments/exp_faster_rcnn_lesions/checkpoints
  monitor: map_50

early_stopping:
  enabled: true
  patience: 7
  monitor: map_50

logging:
  log_every_n_steps: 10

metrics:
  primary: [map_50, map_75]
  secondary: [map]
  per_class: true

experiment:
  name: exp_faster_rcnn_lesions
  seed: 42
