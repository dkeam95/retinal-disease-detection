dataset:
  path: data/raw
  annotation_file: train.txt
  image_directory: train
  num_classes: 5

preprocessing:
  pipeline: [resize, horizontal_flip, vertical_flip, rotation, brightness_contrast, normalize, to_tensor]
  resize: {height: 224, width: 224}
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  rotation_limit: 180
  rotation_prob: 0.5
  brightness_contrast_prob: 0.4
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  architecture: densenet121
  pretrained: true
  num_classes: 5
  dropout_rate: 0.3

loss:
  name: class_balanced_focal
  gamma: 2.0
  beta: 0.9999

optimizer:
  name: adamw
  learning_rate: 0.00015
  weight_decay: 0.001

scheduler:
  name: cosine
  eta_min: 1.0e-6

training:
  epochs: 15
  device: cuda
  deterministic: true

mixed_precision:
  enabled: true
  dtype: float16

dataloader:
  batch_size: 48
  num_workers: 2
  shuffle: true
  pin_memory: true
  persistent_workers: false
  drop_last: false

checkpoint:
  directory: experiments/exp_02_densenet121_v2/checkpoints
  monitor: qwk

early_stopping:
  enabled: true
  patience: 7
  monitor: qwk

logging:
  log_every_n_steps: 10

metrics:
  primary: [accuracy, qwk]
  secondary: [macro_f1]
  per_class: true

experiment:
  name: exp_02_densenet121_v2
  seed: 42
