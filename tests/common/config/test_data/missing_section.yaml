dataset:
  path: "data/raw"
  annotation_file: "train.txt"
  image_directory: "images"
  num_classes: 5

preprocessing:
  image_size: 224

  mean:
    - 0.485
    - 0.456
    - 0.406

  std:
    - 0.229
    - 0.224
    - 0.225

  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0

  rotation_limit: 15
  rotation_prob: 0.5

  brightness_contrast_prob: 0.2

# training:
#   ← intentionally missing

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 5

loss:
  name: "cross_entropy"

metrics:
  primary:
    - "qwk"

  secondary:
    - "accuracy"

experiment:
  name: "baseline"
  seed: 42
